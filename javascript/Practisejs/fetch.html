      let url1 = "https://catfact.ninja/fact ";
      async function demo() {
        try {
          let res = await fetch(url1);
          let data = await res.json();
          // console.log(res)
          console.log(data.fact);
          let res1 = await fetch(url1);
          let data1 = await res1.json();

      }
      demo();
