      console.log(data)

            savetoDb(

              () => {

                savetoDb(
                  "hello world",
                  () => {
                    console.log("success2 : saved!");
                    savetoDb("world namaste",()=>{

                      console.log("success3 : saved");
                    },()=>{

                      console.log("failure3 : weak connection.data not saved");
                    })
                  },
                  () => {
                    console.log("failure2 : weak connection");
                  },
                );
