<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body>
<form>
  <h1>Registration Form</h1>
  <div><input type="text" name="FirstName"  placeholder="First Name">
  <input type="text" name="LastName"  placeholder="Last Name"></div>

  <div>
  <label for="gender">Please select gender</label>
  <select name="gender" id="gender">
     <option value="male">Male</option>
     <option value="female">Female</option>
     <option value="other">Other</option>
  </select><div>
<div>
  Do you agree to all terms of service?
  <input type="checkbox" name="agree" id="agree"><label for="agree">Yes, I agree</label></div>

  <button>Register</button>

</form>
</body>
</html>
