<style>
#mainTopic{
  color:blue;
}

*{
  text-align:center;
}

h1,h3,h5{
  font-family:Georgia;
}

p{
  color:white;
  background-color:cornflowerblue;
}

div button{
  background-color:rgb(229, 20, 194);
  color:azure;
}

/* pseudo class selector */
div button:hover{
  background-color:yellow;
  color:rgb(71, 13, 216);
}
/* pseudo class selector */
p:nth-of-type(2n+1){
  color:yellow;
}
/* pseudo element selector */
h1::first-letter
{
  color:rgb(222, 14, 25);
  
}
/* pseudo class selector */
input[ type="checkbox"]:checked+label{   
  color:green;
}


</style>
