<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-index</title>
  </head>
  <body>
    <h1>Z-Index</h1>
    <div class="box one">1</div>
    <div class="box two">2</div>
    <div class="box three">3</div>

    <style>
      .box {
        height: 150px;
        width: 150px;
        border: 2px solid black;
        background-color: rgb(61, 33, 132);
      }

      .one {
        background-color: pink;
        position:static;
        z-index:1;  /*here position is static therefore z-index value cannot be set*/
   position:relative;/*once position value is other than static z-index value is set*/
        z-index:1;


      }

      .two{
         background-color: rgb(188, 14, 43);
         position: relative;
           z-index:2;
         bottom: 50px;
      }
    </style>
  </body>
</html>
