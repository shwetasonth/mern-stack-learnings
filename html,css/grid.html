<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grid css part-6</title>
  </head>
  <body>
    <div class="container">
      <div class="item one">1</div>
      <div class="item two">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
    </div>

    <style>
      .container {
        height: 300px;
        width: 600px;
        background-color: rgb(221, 22, 118);
        display: grid;
        /* grid-template-rows: 50px 50px 50px 50px 50px;
        grid-template-columns: 100px 100px 100px; */

        grid-template-rows: repeat(4, 1fr);
        grid-template-rows: 1fr 1fr 1fr 1fr; /*above and this stmt are same*/
        grid-template-columns: repeat(3, 1fr);

        /* row-gap: 10px;
        column-gap: 10px;
        grid-gap: 5px 5px; */
        grid-gap: 10px;

        justify-items: start;
        justify-items: end;
        justify-items: center;
        align-items: center;
        place-items: center; /*shorthand*/
      }

      .item {
        height: 50px;
        width: 100px;
        background-color: greenyellow;
        border: 2px solid black;
        text-align: center;
      }

      .one {
        grid-column-start: 1;
        grid-column-end: 3;
        grid-column: 1/3;
        grid-column: 1 / span 3;
        justify-self: center;
        place-self: center;/*shorthand*/
      }
      /* .two { */
      /* grid-row-start: 1; */
      /* grid-row-end: 3; */
      /* grid-row:1/3; */
      /* grid-row: 1 / span 3; */
      /* } */
    </style>
  </body>
</html>
